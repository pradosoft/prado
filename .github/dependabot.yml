# Dependabot opens pull requests that bump outdated dependencies.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # GitHub Actions in .github/workflows/; all bumps arrive in one weekly pull request.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # The static analysis tools are pinned to exact versions in composer.json, so a release
  # that adds rules arrives as a pull request instead of failing every branch's CI.
  # Other Composer dependencies keep their ranges and are not managed here.
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    allow:
      - dependency-name: "phpstan/phpstan"
      - dependency-name: "friendsofphp/php-cs-fixer"
    # Both tools' bumps arrive in one pull request with one CI run.
    groups:
      analysis-tools:
        patterns:
          - "phpstan/phpstan"
          - "friendsofphp/php-cs-fixer"
